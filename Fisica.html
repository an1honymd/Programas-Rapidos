<!DOCTYPE html>
<html>
<head>
  <title>Electronics Circuit Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
      background-color: #f0f0f0;
      color: #333;
    }
    .simulator {
      text-align: center;
      background-color: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .simulator input[type="number"] {
      width: 50px;
      margin: 10px;
      padding: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      border: none;
      border-radius: 5px;
    }
    .simulator button {
      margin: 10px;
      padding: 5px 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
    }
    .simulator button:hover {
      background-color: #0056b3;
    }
    p {
      margin: 10px;
      font-size: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="simulator">
    <h1>Electronics Circuit Simulator</h1>
    <p>Enter values for the circuit elements:</p>
    <input type="number" id="resistor1" placeholder="Resistor 1 (Ω)">
    <input type="number" id="resistor2" placeholder="Resistor 2 (Ω)">
    <input type="number" id="voltage" placeholder="Voltage (V)">
    <button onclick="calculateCurrent()">Calculate Current</button>
    <button onclick="calculatePower()">Calculate Power</button>
    <button onclick="calculateSeriesResistor()">Calculate Series Resistance</button>
    <button onclick="calculateParallelResistor()">Calculate Parallel Resistance</button>
    <button onclick="calculateCircuitResistance()">Calculate Circuit Resistance</button>
    <button onclick="calculateCircuitPower()">Calculate Circuit Power</button>
    <button onclick="calculateCircuitVoltage()">Calculate Circuit Voltage</button>
    <p>Current (A): <span id="current"></span></p>
    <p>Power (W): <span id="power"></span></p>
    <p>Series Resistance (Ω): <span id="seriesResistance"></span></p>
    <p>Parallel Resistance (Ω): <span id="parallelResistance"></span></p>
    <p>Circuit Resistance (Ω): <span id="circuitResistance"></span></p>
    <p>Circuit Power (W): <span id="circuitPower"></span></p>
    <p>Circuit Voltage (V): <span id="circuitVoltage"></span></p>
  </div>

  <script>
    function calculateCurrent() {
      const resistance1 = document.getElementById("resistor1").value;
      const resistance2 = document.getElementById("resistor2").value;
      const voltage = document.getElementById("voltage").value;
      const totalResistance = resistance1 + resistance2;
      const current = voltage / totalResistance;
      document.getElementById("current").innerText = current;
      document.getElementById("seriesResistance").innerText = totalResistance;
      document.getElementById("circuitPower").innerText = voltage * current;
      document.getElementById("circuitVoltage").innerText = voltage;
    }
    function calculatePower() {
      const current = document.getElementById("current").innerText;
      const voltage = document.getElementById("voltage").value;
      const power = voltage * current;
      document.getElementById("power").innerText = power;
      document.getElementById("circuitPower").innerText = power;
    }
    function calculateSeriesResistor() {
      const resistance1 = document.getElementById("resistor1").value;
      const resistance2 = document.getElementById("resistor2").value;
      const seriesResistance = resistance1 + resistance2;
      document.getElementById("seriesResistance").innerText = seriesResistance;
      document.getElementById("circuitResistance").innerText = seriesResistance;
    }
    function calculateParallelResistor() {
      const resistance1 = document.getElementById("resistor1").value;
      const resistance2 = document.getElementById("resistor2").value;
      const parallelResistance = (resistance1 * resistance2) / (resistance1 + resistance2);
      document.getElementById("parallelResistance").innerText = parallelResistance;
      document.getElementById("circuitResistance").innerText = parallelResistance;
    }
    function calculateCircuitResistance() {
      const totalResistance = document.getElementById("seriesResistance").innerText || document.getElementById("parallelResistance").innerText || 0;
      document.getElementById("circuitResistance").innerText = totalResistance;
    }
    function calculateCircuitPower() {
      const voltage = document.getElementById("voltage").value;
      const current = document.getElementById("current").innerText;
      const circuitPower = voltage * current;
      document.getElementById("circuitPower").innerText = circuitPower;
    }
    function calculateCircuitVoltage() {
      const current = document.getElementById("current").innerText;
      const circuitResistance = document.getElementById("circuitResistance").innerText;
      const circuitVoltage = current * circuitResistance;
      document.getElementById("circuitVoltage").innerText = circuitVoltage;
    }
  </script>
</body>
</html>
